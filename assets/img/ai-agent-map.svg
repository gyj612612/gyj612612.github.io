<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">AI agent robotics blueprint</title>
  <desc id="desc">An AI research map showing trustworthy agent memory, agent planning, multimodal perception, robot control, product feedback, and UAV systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#132022"/>
      <stop offset=".55" stop-color="#1d4e55"/>
      <stop offset="1" stop-color="#1d7a78"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#f2ca68"/>
      <stop offset="1" stop-color="#fff2c4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f2ca68"/>
    </marker>
  </defs>
  <rect width="1120" height="680" rx="34" fill="url(#bg)"/>
  <g opacity=".14" stroke="#fff" fill="none">
    <path d="M80 112 H1040"/>
    <path d="M80 250 H1040"/>
    <path d="M80 388 H1040"/>
    <path d="M80 526 H1040"/>
    <path d="M210 72 V608"/>
    <path d="M430 72 V608"/>
    <path d="M690 72 V608"/>
    <path d="M910 72 V608"/>
  </g>

  <text x="72" y="58" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="850" fill="#fffaf2">AI Agent Robotics Blueprint</text>
  <text x="72" y="88" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="650" fill="#d7f0ec">agent memory · planning and tools · multimodal perception · UAV systems · robotics</text>

  <g stroke="#f2ca68" stroke-width="3" marker-end="url(#arrow)" fill="none" opacity=".9">
    <path d="M252 216 C330 216 340 176 408 176"/>
    <path d="M492 176 C574 176 586 216 650 216"/>
    <path d="M764 216 C835 216 846 300 902 300"/>
    <path d="M902 388 C820 470 640 500 498 486"/>
    <path d="M410 486 C318 486 286 394 250 318"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" filter="url(#shadow)">
    <rect x="72" y="146" width="180" height="140" rx="22" fill="#fffaf2"/>
    <text x="162" y="190" text-anchor="middle" font-size="29" font-weight="850" fill="#172024">LLM</text>
    <text x="162" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#5f676d">persistent memory</text>
    <text x="162" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#5f676d">reasoning, tool use</text>

    <rect x="408" y="114" width="178" height="124" rx="22" fill="url(#gold)"/>
    <text x="497" y="158" text-anchor="middle" font-size="28" font-weight="850" fill="#172024">Agent</text>
    <text x="497" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#5f676d">planning loop</text>
    <text x="497" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#5f676d">tool orchestration</text>

    <rect x="650" y="146" width="220" height="140" rx="22" fill="#fffaf2"/>
    <text x="760" y="190" text-anchor="middle" font-size="28" font-weight="850" fill="#172024">Multimodal</text>
    <text x="760" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#5f676d">vision + sensor + text</text>
    <text x="760" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#5f676d">scene understanding</text>

    <rect x="902" y="246" width="150" height="144" rx="22" fill="#c35d36"/>
    <text x="977" y="294" text-anchor="middle" font-size="26" font-weight="850" fill="#fff">Robot</text>
    <text x="977" y="326" text-anchor="middle" font-size="15" font-weight="700" fill="#ffe3d8">control</text>
    <text x="977" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#ffe3d8">embodiment</text>

    <rect x="650" y="450" width="220" height="118" rx="22" fill="#fffaf2"/>
    <text x="760" y="488" text-anchor="middle" font-size="25" font-weight="850" fill="#172024">UAV Systems</text>
    <text x="760" y="518" text-anchor="middle" font-size="15" font-weight="700" fill="#5f676d">aerial autonomy</text>
    <text x="760" y="542" text-anchor="middle" font-size="13" font-weight="800" fill="#1d7a78">ONGOING</text>

    <rect x="350" y="430" width="180" height="118" rx="22" fill="#fffaf2"/>
    <text x="440" y="470" text-anchor="middle" font-size="22" font-weight="850" fill="#172024">Agent Memory</text>
    <text x="440" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#5f676d">memory robustness</text>
    <text x="440" y="524" text-anchor="middle" font-size="12" font-weight="800" fill="#1d7a78">AAAI 2027 · SUBMITTED</text>

    <rect x="72" y="300" width="178" height="132" rx="22" fill="#fffaf2"/>
    <text x="161" y="346" text-anchor="middle" font-size="25" font-weight="850" fill="#172024">Product</text>
    <text x="161" y="378" text-anchor="middle" font-size="15" font-weight="700" fill="#5f676d">startup validation</text>
    <text x="161" y="402" text-anchor="middle" font-size="15" font-weight="700" fill="#5f676d">user feedback</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" fill="#fffaf2">
    <text x="72" y="622" font-size="18" font-weight="800">Research anchors:</text>
    <text x="246" y="622" font-size="16" font-weight="650">memory repair</text>
    <text x="390" y="622" font-size="16" font-weight="650">UAV systems</text>
    <text x="520" y="622" font-size="16" font-weight="650">multimodal perception</text>
    <text x="742" y="622" font-size="16" font-weight="650">robot deployment</text>
    <text x="920" y="622" font-size="16" font-weight="650">product validation</text>
  </g>
</svg>
